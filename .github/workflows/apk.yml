name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE: https://monumental-jelly-138608.netlify.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Uygulama dosyalarını hazırla
        run: |
          # Every uploaded zip that holds the app is looked at, whatever its name,
          # and the one uploaded LAST is used (an old "android-project (1).zip" can no longer win).
          found=""
          newest=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            if unzip -l "$f" | grep -q "app/build.gradle" || unzip -l "$f" | grep -q "android-project.zip"; then
              t=$(git log -1 --format=%ct -- "$f")
              t=${t:-0}
              echo "Bulunan: $f (yüklenme: $(date -d @$t '+%Y-%m-%d %H:%M'))"
              if [ "$t" -gt "$newest" ]; then newest=$t; found="$f"; fi
            fi
          done
          if [ -n "$found" ] && ! unzip -l "$found" | grep -q "app/build.gradle"; then
            unzip -p "$found" android-project.zip > inner.zip; found=inner.zip
          fi
          if [ -z "$found" ]; then curl -fsSL "$SITE/android-project.zip" -o project.zip; found=project.zip; fi
          echo "Kullanılan dosya: $found"
          mkdir src && unzip -q "$found" -d src

      - name: İmza anahtarı
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -keystore release.jks -storepass kelimekartlari -keypass kelimekartlari -alias kelime -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kelime Kartlari"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add release.jks
            git commit -m "İmza anahtarı"
            git push
          fi
          cp release.jks src/release.jks

      - name: APK'yı derle
        working-directory: src
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_PASS: kelimekartlari
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../KelimeKartlari.apk

      - name: İndirmeye hazırla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kelime Kartları ${{ github.run_number }}
          files: KelimeKartlari.apk
