name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE: https://monumental-jelly-138608.netlify.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Uygulama dosyalarını hazırla
        run: |
          # Any uploaded zip works, whatever its name: the Android project itself,
          # or the app package that has the Android project inside it.
          found=""
          for f in android-project*.zip *.zip; do
            [ -f "$f" ] || continue
            if unzip -l "$f" | grep -q "app/build.gradle"; then found="$f"; break; fi
            if unzip -l "$f" | grep -q "android-project.zip"; then unzip -p "$f" android-project.zip > inner.zip; found=inner.zip; break; fi
          done
          if [ -z "$found" ]; then curl -fsSL "$SITE/android-project.zip" -o project.zip; found=project.zip; fi
          echo "Kullanılan dosya: $found"
          mkdir src && unzip -q "$found" -d src

      - name: İmza anahtarı
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -keystore release.jks -storepass kelimekartlari -keypass kelimekartlari -alias kelime -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kelime Kartlari"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add release.jks
            git commit -m "İmza anahtarı"
            git push
          fi
          cp release.jks src/release.jks

      - name: APK'yı derle
        working-directory: src
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_PASS: kelimekartlari
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../KelimeKartlari.apk

      - name: İndirmeye hazırla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kelime Kartları ${{ github.run_number }}
          files: KelimeKartlari.apk
